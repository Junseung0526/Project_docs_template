name: 기능 요청
description: 새 기능이나 개선 작업
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 이 작업으로 해결하려는 문제
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 무엇이 되면 끝인지 확인 가능한 문장으로
  - type: input
    id: feature
    attributes:
      label: 관련 기능 번호
      placeholder: "예: 01 (docs/FEATURES.md)"
