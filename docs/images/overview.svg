<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="419" rx="16" fill="none" stroke="#e2e8f0"/>

  <text x="480" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Junseung0526 · 한눈에 보기</text>
  <text x="480" y="64" text-anchor="middle" font-size="13" fill="#64748b">무엇을 받아서, 어떻게 처리하고, 무엇을 돌려주는지 한 줄로</text>

  <!-- ① 입력: 칸을 늘리려면 rect/text 묶음을 복사해 y를 68씩 내리세요 -->
  <text x="140" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">① 입력</text>
  <g font-size="13" fill="#0f172a">
    <rect x="40" y="114" width="200" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="140" y="138" text-anchor="middle" font-weight="600">입력 1</text>
    <text x="140" y="157" text-anchor="middle" font-size="11" fill="#64748b">설명</text>
    <rect x="40" y="182" width="200" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="140" y="206" text-anchor="middle" font-weight="600">입력 2</text>
    <text x="140" y="225" text-anchor="middle" font-size="11" fill="#64748b">설명</text>
    <rect x="40" y="250" width="200" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="140" y="274" text-anchor="middle" font-weight="600">입력 3</text>
    <text x="140" y="293" text-anchor="middle" font-size="11" fill="#64748b">설명</text>
  </g>

  <!-- ② 처리 -->
  <text x="480" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">② 처리</text>
  <rect x="320" y="114" width="320" height="192" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
  <g font-size="13" fill="#0f172a">
    <rect x="340" y="130" width="280" height="40" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="480" y="155" text-anchor="middle"><tspan font-weight="600">기능 A</tspan> · 한 줄 설명</text>
    <rect x="340" y="190" width="280" height="40" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="480" y="215" text-anchor="middle"><tspan font-weight="600">기능 B</tspan> · 한 줄 설명</text>
    <rect x="340" y="250" width="280" height="40" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="480" y="275" text-anchor="middle"><tspan font-weight="600">기능 C</tspan> · 한 줄 설명</text>
  </g>

  <!-- ③ 출력 -->
  <text x="820" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">③ 출력</text>
  <g font-size="13" fill="#0f172a">
    <rect x="720" y="114" width="200" height="56" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="820" y="138" text-anchor="middle" font-weight="600">결과 1</text>
    <text x="820" y="157" text-anchor="middle" font-size="11" fill="#64748b">설명</text>
    <rect x="720" y="182" width="200" height="56" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="820" y="206" text-anchor="middle" font-weight="600">결과 2</text>
    <text x="820" y="225" text-anchor="middle" font-size="11" fill="#64748b">설명</text>
    <rect x="720" y="250" width="200" height="56" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="820" y="274" text-anchor="middle" font-weight="600">결과 3</text>
    <text x="820" y="293" text-anchor="middle" font-size="11" fill="#64748b">설명</text>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M248,210 L312,210"/>
    <path d="M648,210 L712,210"/>
  </g>

  <rect x="40" y="330" width="880" height="44" rx="10" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="480" y="357" text-anchor="middle" font-size="13" fill="#0f172a"><tspan font-weight="700" fill="#db2777">공통 기능</tspan>  ·  모든 단계에 걸친 기능이 있으면 여기에 (없으면 이 칸을 지우세요)</text>
  <text x="480" y="400" text-anchor="middle" font-size="11" fill="#94a3b8">설계 원칙 1 · 설계 원칙 2 · 설계 원칙 3</text>
</svg>
